server:
  port: 8080

spring:
  application:
    name: landlock-engine
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/landlockdb}
    username: ${DATABASE_USER:landlock}
    password: ${DATABASE_PASSWORD:landlock}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

landlock:
  jwt:
    secret: ${JWT_SECRET:a-very-long-secret-key-for-demo-change-in-production-min-256-bits}
    expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
